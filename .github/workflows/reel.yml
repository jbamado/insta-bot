name: Instagram Reel Generator

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC todos os dias
  workflow_dispatch:        # permite correr manualmente

jobs:
  reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg fonts-roboto

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements_reel.txt

      - name: Generate and post Reel
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
          MAKE_REEL_WEBHOOK:  ${{ secrets.MAKE_REEL_WEBHOOK }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PIXABAY_API_KEY:    ${{ secrets.PIXABAY_API_KEY }}
        run: python reel_bot.py
