name: Instagram Reel Generator

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC todos os dias
  workflow_dispatch:        # permite correr manualmente

jobs:
  reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg fonts-roboto wget
          mkdir -p /usr/share/fonts/truetype/bebas
          wget -q "https://github.com/google/fonts/raw/main/ofl/bebasneueneu/BebasNeue-Regular.ttf" \
               -O /usr/share/fonts/truetype/bebas/BebasNeue-Regular.ttf || \
          wget -q "https://fonts.gstatic.com/s/bebasneueneu/v14/JTUSjIg69CK48gW7PXooxW5rygbi49c.ttf" \
               -O /usr/share/fonts/truetype/bebas/BebasNeue-Regular.ttf || \
          echo "Bebas Neue download failed — will use Roboto Bold fallback"
          fc-cache -fv || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements_reel.txt

      - name: Generate and post Reel
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
          MAKE_REEL_WEBHOOK:  ${{ secrets.MAKE_REEL_WEBHOOK }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PIXABAY_API_KEY:    ${{ secrets.PIXABAY_API_KEY }}
        run: python reel_bot.py

      - name: Save used stories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f used_stories.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "bot: update used stories [skip ci]"
          git push || true
