name: Crypto Signal Scanner

on:
  schedule:
    - cron: "*/20 * * * *"   # a cada 20 minutos, 24/7
  workflow_dispatch:          # permite correr manualmente

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements_signals.txt

      - name: Run signal scanner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signal_bot.py

      - name: Save state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f positions.json last_summary.txt trade_history.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "bot: update state [skip ci]"
          git push || true
